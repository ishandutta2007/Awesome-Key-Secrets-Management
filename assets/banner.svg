<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
      50% { transform: translateY(-15px) rotate(180deg); opacity: 0.7; }
      100% { transform: translateY(0px) rotate(360deg); opacity: 0.2; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    
    .bg-pulse-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-pulse-2 { animation: pulseGlow 8s ease-in-out infinite 2s; transform-origin: 1000px 220px; }
    .particle-1 { animation: floatParticle 7s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 9s ease-in-out infinite 1.5s; }
    .ring-rotate { animation: rotateRing 25s linear infinite; transform-origin: 1060px 160px; }
    .dash-line { stroke-dasharray: 10 15; animation: dashMove 20s linear infinite; }
    
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Background Glowing Orbs (Behind text) -->
  <circle class="bg-pulse-1" cx="200" cy="100" r="180" fill="#4f46e5" opacity="0.3" filter="url(#glow)" />
  <circle class="bg-pulse-2" cx="1000" cy="220" r="160" fill="#9333ea" opacity="0.3" filter="url(#glow)" />

  <!-- Decorative Tech Circuit Lines (Background Layer) -->
  <path class="dash-line" d="M 50 280 L 300 280 L 380 220 L 800 220 L 880 280 L 1150 280" stroke="#312e81" stroke-width="2" fill="none" />
  <path class="dash-line" d="M 100 40 L 400 40 L 480 90 L 900 90 L 980 40 L 1100 40" stroke="#4338ca" stroke-width="1.5" fill="none" />

  <!-- Animated Floating Security Particles -->
  <g class="particle-1">
    <circle cx="150" cy="220" r="4" fill="#a855f7" />
    <circle cx="950" cy="80" r="6" fill="#38bdf8" />
  </g>
  <g class="particle-2">
    <circle cx="280" cy="70" r="5" fill="#ec4899" />
    <circle cx="850" cy="250" r="4" fill="#818cf8" />
  </g>

  <!-- Right Side Security Vault Symbol (Dynamic Rotating Element) -->
  <g class="ring-rotate" opacity="0.4">
    <circle cx="1060" cy="160" r="90" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="12 8" fill="none" />
    <circle cx="1060" cy="160" r="65" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" fill="none" />
  </g>
  <!-- Vault Padlock Graphic -->
  <g transform="translate(1030, 130)" filter="url(#glow)">
    <rect x="10" y="25" width="40" height="32" rx="6" fill="url(#accentGrad)" />
    <path d="M 20 25 V 16 A 10 10 0 0 1 40 16 V 25" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="30" cy="38" r="4" fill="#ffffff" />
    <path d="M 30 42 V 48" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="312" width="1200" height="8" fill="url(#accentGrad)" rx="4" />

  <!-- FOREGROUND TEXT & CONTENT LAYER (Guaranteed clear visibility) -->
  <!-- Top Category Tag -->
  <rect x="70" y="55" width="230" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
  <text x="85" y="74" class="badge-text">🔐 DEVSECOPS & SECURITY</text>

  <!-- Main Title -->
  <text x="70" y="135" class="main-title">Awesome Key &amp; Secrets Management</text>

  <!-- Subtitle Line 1 -->
  <text x="70" y="180" class="subtitle">Curated List of SaaS Platforms &amp; Open-Source Secrets Engines</text>

  <!-- Subtitle Line 2 (Feature Tags) -->
  <g transform="translate(70, 215)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="150" height="32" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="15" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🗝️ Secret Vaults</text>

    <!-- Tag 2 -->
    <rect x="162" y="0" width="180" height="32" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="177" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Dynamic Credentials</text>

    <!-- Tag 3 -->
    <rect x="354" y="0" width="170" height="32" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="369" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛡️ Encryption KMS</text>

    <!-- Tag 4 -->
    <rect x="536" y="0" width="160" height="32" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="551" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚀 GitOps &amp; PKI</text>
  </g>
</svg>
