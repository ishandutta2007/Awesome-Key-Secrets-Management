<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing Circle Gradient 1 -->
    <radialGradient id="orbGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Circle Gradient 2 -->
    <radialGradient id="orbGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Vault Padlock Gradient -->
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Glowing Background Orbs -->
  <circle cx="200" cy="90" r="220" fill="url(#orbGrad1)" />
  <circle cx="980" cy="210" r="200" fill="url(#orbGrad2)" />

  <!-- Decorative Circuit Lines -->
  <path d="M 50 270 L 260 270 L 320 220 L 780 220 L 840 270 L 1150 270" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="6 6" />
  <path d="M 120 50 L 380 50 L 440 95 L 860 95 L 920 50 L 1080 50" stroke="#312e81" stroke-width="2" fill="none" />

  <!-- Vault Illustration Graphic (Right Side) -->
  <g transform="translate(980, 160)">
    <!-- Outer Concentric Tech Rings -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#4c1d95" stroke-width="2" stroke-dasharray="12 8" opacity="0.6" />
    <circle cx="0" cy="0" r="68" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.8" />
    <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
    
    <!-- Lock Graphic -->
    <rect x="-22" y="-5" width="44" height="36" rx="6" fill="url(#lockGrad)" />
    <path d="M -13 -5 V -15 A 13 13 0 0 1 13 -15 V -5" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="0" cy="10" r="4" fill="#ffffff" />
    <path d="M 0 14 V 20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Category Tag / Badge -->
  <rect x="70" y="52" width="220" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="180" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">🔐 DEVSECOPS &amp; SECURITY</text>

  <!-- Main Title -->
  <text x="70" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Awesome Key &amp; Secrets Management</text>

  <!-- Subtitle -->
  <text x="70" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1">Curated Ecosystem of SaaS Platforms &amp; Open-Source Secrets Engines</text>

  <!-- Feature Pill Tags -->
  <!-- Tag 1: Secret Vaults -->
  <rect x="70" y="208" width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="142" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🗝️ Secret Vaults</text>

  <!-- Tag 2: Dynamic Credentials -->
  <rect x="227" y="208" width="175" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="314" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Dynamic Credentials</text>

  <!-- Tag 3: Encryption KMS -->
  <rect x="414" y="208" width="165" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="496" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🛡️ Encryption KMS</text>

  <!-- Tag 4: GitOps & PKI -->
  <rect x="591" y="208" width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="663" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🚀 GitOps &amp; PKI</text>

  <!-- Bottom Accent Border -->
  <rect x="0" y="312" width="1200" height="8" rx="4" fill="url(#accentGrad)" />
</svg>
